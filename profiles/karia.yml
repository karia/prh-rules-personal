version: 1
rules:
  # 記号は全角を使う（日本語文中）
  # 日本語に隣接する場合だけ置き換える。英文中の括弧は対象外。
  - expected: （$1）
    patterns:
      - /(?<=[ぁ-んァ-ヶ一-龥ー])\(([^()]{1,30}?)\)/
      - /\(([^()]{1,30}?)\)(?=[ぁ-んァ-ヶ一-龥ー])/
    specs:
      - from: トークン(PAT)を渡す
        to: トークン（PAT）を渡す
      - from: See the docs (RFC 1234) first
        to: See the docs (RFC 1234) first

  # 数値表記を統一する
  # 単位を伴う数字だけを対象にする。年号やバージョン番号を巻き込まないため。
  # 万・億・兆の直後を除くのは、「16万8000円」を「16万8,000円」にしないため。
  - expected: $1,$2,$3$4$5
    patterns:
      - /(?<![\d,.万億兆])(\d{1,3})(\d{3})(\d{3})(\.\d+)?(円|ドル|件|人|回|台|個)/
    specs:
      - from: 費用は1000000ドルでした
        to: 費用は1,000,000ドルでした
  - expected: $1,$2$3$4
    patterns:
      - /(?<![\d,.万億兆])(\d{1,3})(\d{3})(\.\d+)?(円|ドル|件|人|回|台|個)/
    specs:
      - from: 費用は1051.2ドルでした
        to: 費用は1,051.2ドルでした
      - from: 費用は12345円でした
        to: 費用は12,345円でした
      - from: 2026年に導入した
        to: 2026年に導入した
      - from: 追加費用は16万8000円です
        to: 追加費用は16万8000円です

  # 万単位の数字は「16万8千円」ではなく「16万8000円」と書く
  # prh の $2 は $20 と解釈されるため、桁ごとに書き分ける。
  - expected: 万1000
    patterns:
      - /万1千/
    specs:
      - from: 追加費用は16万1千円です
        to: 追加費用は16万1000円です
  - expected: 万2000
    patterns:
      - /万2千/
    specs:
      - from: 追加費用は16万2千円です
        to: 追加費用は16万2000円です
  - expected: 万3000
    patterns:
      - /万3千/
    specs:
      - from: 追加費用は16万3千円です
        to: 追加費用は16万3000円です
  - expected: 万4000
    patterns:
      - /万4千/
    specs:
      - from: 追加費用は16万4千円です
        to: 追加費用は16万4000円です
  - expected: 万5000
    patterns:
      - /万5千/
    specs:
      - from: 追加費用は16万5千円です
        to: 追加費用は16万5000円です
  - expected: 万6000
    patterns:
      - /万6千/
    specs:
      - from: 追加費用は16万6千円です
        to: 追加費用は16万6000円です
  - expected: 万7000
    patterns:
      - /万7千/
    specs:
      - from: 追加費用は16万7千円です
        to: 追加費用は16万7000円です
  - expected: 万8000
    patterns:
      - /万8千/
    specs:
      - from: 追加費用は16万8千円です
        to: 追加費用は16万8000円です
  - expected: 万9000
    patterns:
      - /万9千/
    specs:
      - from: 追加費用は16万9千円です
        to: 追加費用は16万9000円です

  # 英語略語は正式な表記で書く
  # ファイル名の一部（package.json など）を巻き込まないよう前後を制限する。
  - expected: MCP
    patterns:
      - /(?<![.\w-])mcp(?![.\w-])/
      - /(?<![.\w-])Mcp(?![.\w-])/
    specs:
      - from: mcpを確認する
        to: MCPを確認する
  - expected: PAT
    patterns:
      - /(?<![.\w-])pat(?![.\w-])/
      - /(?<![.\w-])Pat(?![.\w-])/
    specs:
      - from: patを確認する
        to: PATを確認する
  - expected: API
    patterns:
      - /(?<![.\w-])api(?![.\w-])/
      - /(?<![.\w-])Api(?![.\w-])/
    specs:
      - from: apiを確認する
        to: APIを確認する
  - expected: AWS
    patterns:
      - /(?<![.\w-])aws(?![.\w-])/
      - /(?<![.\w-])Aws(?![.\w-])/
    specs:
      - from: awsを確認する
        to: AWSを確認する
  - expected: CLI
    patterns:
      - /(?<![.\w-])cli(?![.\w-])/
      - /(?<![.\w-])Cli(?![.\w-])/
    specs:
      - from: cliを確認する
        to: CLIを確認する
  - expected: CPU
    patterns:
      - /(?<![.\w-])cpu(?![.\w-])/
      - /(?<![.\w-])Cpu(?![.\w-])/
    specs:
      - from: cpuを確認する
        to: CPUを確認する
  - expected: DNS
    patterns:
      - /(?<![.\w-])dns(?![.\w-])/
      - /(?<![.\w-])Dns(?![.\w-])/
    specs:
      - from: dnsを確認する
        to: DNSを確認する
  - expected: IAM
    patterns:
      - /(?<![.\w-])iam(?![.\w-])/
      - /(?<![.\w-])Iam(?![.\w-])/
    specs:
      - from: iamを確認する
        to: IAMを確認する
  - expected: JSON
    patterns:
      - /(?<![.\w-])json(?![.\w-])/
      - /(?<![.\w-])Json(?![.\w-])/
    specs:
      - from: jsonを確認する
        to: JSONを確認する
  - expected: SDK
    patterns:
      - /(?<![.\w-])sdk(?![.\w-])/
      - /(?<![.\w-])Sdk(?![.\w-])/
    specs:
      - from: sdkを確認する
        to: SDKを確認する
  - expected: SQL
    patterns:
      - /(?<![.\w-])sql(?![.\w-])/
      - /(?<![.\w-])Sql(?![.\w-])/
    specs:
      - from: sqlを確認する
        to: SQLを確認する
  - expected: SSH
    patterns:
      - /(?<![.\w-])ssh(?![.\w-])/
      - /(?<![.\w-])Ssh(?![.\w-])/
    specs:
      - from: sshを確認する
        to: SSHを確認する
  - expected: URL
    patterns:
      - /(?<![.\w-])url(?![.\w-])/
      - /(?<![.\w-])Url(?![.\w-])/
    specs:
      - from: urlを確認する
        to: URLを確認する
  - expected: YAML
    patterns:
      - /(?<![.\w-])yaml(?![.\w-])/
      - /(?<![.\w-])Yaml(?![.\w-])/
    specs:
      - from: yamlを確認する
        to: YAMLを確認する

  # 動詞は常用漢字で書く
  - expected: を付け$1
    patterns:
      - /をつけ(る|た|ない|ます|れば|よう)/
    specs:
      - from: タグをつけない場合
        to: タグを付けない場合

  # 冗長表現を避ける
  - expected: しました
    patterns:
      - /することにしました/
    specs:
      - from: 導入することにしました
        to: 導入しました
  - expected: です
    patterns:
      - /のようなものです/
    specs:
      - from: これは設定のようなものです
        to: これは設定です
  - expected: ており
    patterns:
      - /てきており/
    specs:
      - from: 改善を進めてきており
        to: 改善を進めており
      - from: 対応してきており
        to: 対応しており
  # 「場合によります」のように「事情次第だ」の意味で使う場合は除く。
  - expected: によると
    patterns:
      - /(?<!場合|状況|ケース|人)によります/
    specs:
      - from: 公式ドキュメントによります
        to: 公式ドキュメントによると
      - from: 時と場合によります
        to: 時と場合によります

  # 接続詞の後に読点を打つ
  - expected: $1、
    patterns:
      - /(?<=^|。)(とはいえ|ただし|しかし|なお|さらに|つまり|したがって|そのため|ところが)(?![、。])/
    specs:
      - from: とはいえ切り戻しは容易でした
        to: とはいえ、切り戻しは容易でした
      - from: 失敗した。ただし影響はない
        to: 失敗した。ただし、影響はない
      - from: とはいえ、切り戻しは容易でした
        to: とはいえ、切り戻しは容易でした
      - from: 安いとはいえ品質は高い
        to: 安いとはいえ品質は高い
